<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Инвестбанк — Совкомбанк Бизнес</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Wix+Madefor+Display:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F6FB; --surface:#FFFFFF; --surface-2:#EDF2FA; --line:#C9D6E8; --line-soft:#E2EAF5;
  --ink:#0E1B2E; --ink-2:#31415A; --muted:#5D6E88;
  --blue:#0033A1; --blue-2:#1D5BD6; --red:#E4002B;
  --ok:#0F7B5A; --ok-bg:#E6F4EE; --warn:#8A5A00; --warn-bg:#FBF1DC; --err-bg:#FCE8EC;
  --c1:#0033A1; --c2:#2E6BDC; --c3:#79A7EE; --c4:#B9D2F7; --c5:#12938E;
  --radius:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground); color:var(--ink); font-family:"Golos Text","Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Wix Madefor Display","Golos Text",Arial,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--blue-2); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

.demobar{background:#1B2942; color:#E7EEFA; font-size:12.5px; padding:7px 16px; display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap}
.demobar .dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.demobar select{background:#2B3B57; color:#E7EEFA; border:1px solid #3D4F6E; border-radius:6px; padding:3px 6px; font-size:12px; font-family:inherit}
.demobar label{display:flex; gap:6px; align-items:center; color:#AEC0DC}

.topbar{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:10px 16px}
.logo{display:flex; flex-direction:column; line-height:1.05; font-family:"Wix Madefor Display",Arial,sans-serif; font-weight:800; font-size:16px; letter-spacing:-.02em; flex:none}
.logo .b1{color:var(--blue)}
.logo .b2{color:var(--red); font-size:13.5px; font-weight:700}
.search{flex:1; min-width:0; position:relative}
.search input{width:100%; padding:10px 36px 10px 12px; border:1px solid var(--ink); border-radius:6px; background:var(--surface); color:var(--ink); font-size:14px}
.search svg{position:absolute; right:10px; top:50%; transform:translateY(-50%); opacity:.7}
.org{flex:none; text-align:right; line-height:1.25}
.org b{font-size:13.5px; font-weight:600; display:block}
.org span{font-size:12px; color:var(--muted)}
.burger{display:none; flex:none; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:8px 10px; cursor:pointer}

.shell{display:grid; grid-template-columns:236px minmax(0,1fr); align-items:start}
.rail{position:sticky; top:57px; align-self:start; height:calc(100vh - 57px); overflow:auto; background:var(--surface); border-right:1px solid var(--line); padding:18px 12px 32px}
.rail .grp{padding:18px 10px 6px; font-size:13px; color:var(--muted)}
.rail a{display:block; padding:7px 10px; border-radius:4px; color:var(--ink); font-size:14.5px; border:1.5px solid transparent}
.rail a:hover{background:var(--surface-2)}
.rail a.active{border-color:var(--red)}
.main{padding:20px 24px 64px; min-width:0; max-width:1120px}

.quick{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px}
.quick button{background:var(--surface); border:1px solid var(--ink); border-radius:6px; padding:9px 26px; font-size:14px; cursor:pointer}
.quick button:hover{border-color:var(--blue); color:var(--blue)}

.titlebar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; border:1.5px solid var(--ink); border-radius:var(--radius); padding:14px 18px; background:var(--surface); margin-bottom:20px}
.titlebar h1{font-size:27px; font-weight:700}
h1.plain{font-size:27px; font-weight:700; margin-bottom:18px}
.crumbs{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); margin-bottom:12px; flex-wrap:wrap}
.crumbs a:hover{color:var(--blue); text-decoration:underline}

.card{background:var(--surface); border:1.5px solid var(--ink); border-radius:var(--radius); padding:18px}
.card.soft{border:1px solid var(--line)}
.card-h{font-size:16px; font-weight:700; margin-bottom:12px; font-family:"Wix Madefor Display",Arial,sans-serif}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px}
.narrow{max-width:420px}
.form{max-width:560px}

.btn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--ink); background:var(--surface); color:var(--ink); padding:9px 18px; border-radius:6px; cursor:pointer; font-size:14.5px}
.btn:hover{border-color:var(--blue); color:var(--blue)}
.btn-primary{background:var(--red); border-color:var(--red); color:#fff; font-weight:600}
.btn-primary:hover{filter:brightness(1.07); color:#fff; border-color:var(--red)}
.btn-ghost{border-style:dashed}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn-row{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:22px}

.tabs{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.tab{padding:9px 20px; border-radius:6px; border:1px solid var(--ink); background:var(--surface); cursor:pointer; font-size:14px}
.tab[aria-selected="true"]{border-width:2px; font-weight:700}
.tab:hover{color:var(--blue)}

.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; text-align:left; padding:11px 2px; background:none; border:0; border-bottom:1px solid var(--line-soft); cursor:pointer; font-size:15px}
.row:last-child{border-bottom:0}
.row:hover .row-name{color:var(--blue)}
.row-val{font-weight:600; white-space:nowrap}

.steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; text-align:center; justify-items:center}
.step .n{width:44px;height:44px;border-radius:6px;background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; margin:0 auto 12px; font-family:"Wix Madefor Display",Arial,sans-serif}
.step h4{font-size:14.5px; margin-bottom:8px}
.step p{margin:0; color:var(--ink-2); font-size:13.5px; max-width:30ch}
.sect-h{font-size:21px; font-weight:700; margin:26px 0 14px; text-align:center}
.sect-h.left{text-align:left}

.menubar{display:flex; gap:12px; flex-wrap:wrap; position:relative; margin:20px 0 14px}
.menubtn{padding:9px 20px; border:1px solid var(--ink); background:var(--surface); border-radius:6px; cursor:pointer; font-size:14.5px}
.menubtn[aria-expanded="true"]{border-width:2px; font-weight:700}
.menu{position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:30; background:var(--surface); border:1.5px solid var(--ink); border-radius:var(--radius); padding:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px 20px; align-items:start}
.menu .col{border:1px solid var(--line); border-radius:8px; padding:12px}
.menu h5{margin:0 0 8px; font-size:13.5px; font-weight:700; font-family:"Golos Text",Arial,sans-serif}
.menu a{display:block; padding:4px 0; font-size:13.5px; color:var(--ink-2)}
.menu a:hover{color:var(--blue)}
.menu a.locked{color:var(--muted)}
.menu a.locked:hover{color:var(--warn)}

.banner{margin-top:16px; border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--surface); padding:24px; display:flex; gap:20px; align-items:center; justify-content:space-between; flex-wrap:wrap; min-height:170px}
.banner h3{font-size:20px; margin-bottom:8px}
.banner p{margin:0; max-width:56ch; color:var(--ink-2); font-size:14.5px}
.banner-meta{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}

.donut-wrap{display:flex; gap:32px; align-items:center; flex-wrap:wrap}
.legend{display:flex; flex-direction:column; gap:10px; min-width:220px; flex:1}
.legend-row{display:flex; align-items:center; gap:10px; font-size:14.5px}
.legend-row .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend-row .lbl{color:var(--ink-2)}

.field{margin-bottom:18px}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:6px}
.field label .req{color:var(--red)}
.field input, .field select{width:100%; padding:9px 2px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; color:var(--ink); font-size:15px; font-family:inherit}
.field select{padding:9px 2px}
.field input:focus, .field select:focus{border-bottom-color:var(--blue)}
.field .hint{font-size:12.5px; color:var(--muted); margin-top:6px}
.field.err input, .field.err select{border-bottom-color:var(--red)}
.field.locked input{color:var(--muted)}
.err-msg{display:none; color:var(--red); font-size:13px; margin-top:6px}
.field.err .err-msg{display:block}
.check{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--ink-2); margin-bottom:20px}
.check input{margin-top:3px; accent-color:var(--blue); width:16px; height:16px; flex:none}
.opt{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; cursor:pointer; font-size:15px; border-bottom:1px solid var(--line-soft)}
.opt:last-of-type{border-bottom:0}
.opt input{accent-color:var(--blue); width:17px; height:17px; flex:none}
.opt .hint{color:var(--muted); font-size:12.5px; margin-left:auto; padding-right:10px}

.panel{background:var(--surface); border:1.5px solid var(--ink); border-radius:var(--radius); padding:22px; min-height:320px}
.panel h3{font-size:18px; margin-bottom:8px}
.panel p{color:var(--ink-2); margin:0 0 18px; max-width:66ch}
.list{display:flex; flex-direction:column}
.list a{display:block; padding:11px 2px; border-bottom:1px solid var(--line-soft); font-size:15px}
.list a:last-child{border-bottom:0}
.list a:hover{color:var(--blue)}

/* статусы, плашки */
.status{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:999px; white-space:nowrap}
.status.ok{background:var(--ok-bg); color:var(--ok)}
.status.wait{background:var(--warn-bg); color:var(--warn)}
.status.no{background:var(--err-bg); color:var(--red)}
.notice{display:flex; gap:14px; align-items:flex-start; border:1px solid var(--line); border-left:4px solid var(--warn); background:var(--warn-bg); border-radius:8px; padding:14px 16px; margin-bottom:20px; flex-wrap:wrap}
.notice.info{border-left-color:var(--blue); background:var(--surface-2)}
.notice h4{font-size:15px; margin-bottom:4px}
.notice p{margin:0; font-size:13.5px; color:var(--ink-2); max-width:72ch}
.notice .btn{margin-left:auto; flex:none}

/* сводные показатели */
.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:var(--line-soft); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:18px}
.fig{background:var(--surface); padding:14px 16px}
.fig .k{font-size:12.5px; color:var(--muted); margin-bottom:6px}
.fig .v{font-size:19px; font-weight:700; font-family:"Wix Madefor Display",Arial,sans-serif}
.fig .v.up{color:var(--ok)}

/* таймлайн заявки */
.timeline{display:flex; flex-direction:column; gap:0; margin:8px 0 4px}
.tl{display:grid; grid-template-columns:28px 1fr; gap:14px; padding-bottom:22px; position:relative}
.tl:last-child{padding-bottom:0}
.tl::before{content:""; position:absolute; left:13px; top:26px; bottom:0; width:2px; background:var(--line)}
.tl:last-child::before{display:none}
.tl .mark{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--muted)}
.tl.done .mark{background:var(--ok); border-color:var(--ok); color:#fff}
.tl.now .mark{border-color:var(--blue); color:var(--blue)}
.tl h4{font-size:15px; margin-bottom:3px}
.tl .when{font-size:12.5px; color:var(--muted)}
.tl p{margin:6px 0 0; font-size:13.5px; color:var(--ink-2); max-width:62ch}

/* таблица истории */
.filters{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:flex-end}
.filters .f{display:flex; flex-direction:column; gap:5px}
.filters label{font-size:12px; color:var(--muted)}
.filters select{padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); font-family:inherit; font-size:14px; color:var(--ink)}
.tablewrap{overflow-x:auto; border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:680px}
th, td{text-align:left; padding:12px 16px; border-bottom:1px solid var(--line-soft); font-size:14px}
th{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.sum{text-align:right; font-weight:600; white-space:nowrap}
td.sum.minus{color:var(--ink)}
td.sum.plus{color:var(--ok)}

.empty{text-align:center; padding:56px 20px; background:var(--surface); border:1.5px dashed var(--line); border-radius:var(--radius)}
.empty h2{font-size:22px; margin-bottom:10px}
.empty p{color:var(--muted); max-width:46ch; margin:0 auto 20px}
.pill{display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}

.hero{border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--surface); padding:28px; margin-bottom:22px}
.hero h1{font-size:30px; margin-bottom:12px}
.hero p{color:var(--ink-2); max-width:64ch; margin:0 0 20px; font-size:15.5px}

.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:#1B2942; color:#fff; padding:12px 18px; border-radius:8px; font-size:14px; z-index:80; transition:opacity .18s ease, transform .18s ease; max-width:90vw; text-align:center}
.toast.on{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .burger{display:block}
  .rail{position:fixed; inset:57px auto 0 0; width:264px; z-index:50; transform:translateX(-102%); transition:transform .18s ease}
  .rail.open{transform:none}
  .main{padding:16px 16px 56px}
  .org{display:none}
  .titlebar h1, h1.plain, .hero h1{font-size:22px}
  .menu{position:static; grid-template-columns:1fr; margin-top:8px}
  .notice .btn{margin-left:0}
}
</style>
</head>
<body>

<div class="demobar">
  <span class="dot"></span>
  <span><b>Демо-прототип.</b> Данные вымышлены, операции не исполняются.</span>
  <label>Клиент <select id="personaSel">
    <option value="qual">с портфелем, квалифицированный</option>
    <option value="new">новый, без продуктов</option>
    <option value="notqual">с портфелем, неквалифицированный</option>
  </select></label>
  <label>Роль <select id="roleSel">
    <option value="treasurer">казначей (готовит)</option>
    <option value="director">руководитель (подписывает)</option>
  </select></label>
</div>

<header class="topbar">
  <button class="burger" id="burger" aria-label="Меню" aria-expanded="false">☰</button>
  <a class="logo" href="#/"><span class="b1">Совкомбанк</span><span class="b2">бизнес</span></a>
  <div class="search">
    <input id="search" type="text" placeholder="Поиск" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </div>
  <div class="org"><b>ООО «Ромашка»</b><span id="userRole">Казначей</span></div>
</header>

<div class="shell">
  <aside class="rail" id="rail"><nav id="nav"></nav></aside>
  <main class="main" id="view"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============ состояние демо ============ */
var state = { persona:"qual", role:"treasurer" };
try{
  var sp = localStorage.getItem("ib-persona"), sr = localStorage.getItem("ib-role");
  if(sp) state.persona = sp;
  if(sr) state.role = sr;
}catch(e){}

var transfer = null;     // черновик пополнения
var REQUEST_ID = "БО-2026-0917";

/* ============ данные ============ */
var rub = function(n){ return new Intl.NumberFormat("ru-RU").format(Math.abs(n)); };
var fmt = function(n){ return rub(n) + " руб."; };
function stub(t){ return "#/stub?t=" + encodeURIComponent(t); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
var CHART_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];

var PRODUCTS = [
  { id:"broker", name:"Брокерское обслуживание", sum:150000000, route:"#/portfolio/broker" },
  { id:"cfa",    name:"ЦФА",                     sum:200000000, route:stub("ЦФА") },
  { id:"struct", name:"Структурные облигации",   sum:500000000, route:stub("Структурные облигации") }
];

var ACCOUNTS = [
  { id:"40702810100000012345", name:"Расчётный счёт", cur:"₽", avail:12450000 },
  { id:"40702810100000098765", name:"Расчётный счёт (резервный)", cur:"₽", avail:3120000 }
];
var BROKER_ACC = "БИС 30060040";

var BROKER_FIGS = { value:150000000, free:4200000, income:8740000, incomePct:6.2, nextCoupon:"14.10.2026" };

var HISTORY = [
  { d:"16.09.2026", type:"deal",   op:"Покупка",    ins:"ОФЗ 26253, 25 000 шт.",              sum:-25000000, st:"ok" },
  { d:"15.09.2026", type:"money",  op:"Зачисление", ins:"Пополнение с расчётного счёта",       sum:30000000,  st:"ok" },
  { d:"12.09.2026", type:"income", op:"Купон",      ins:"Систем2Р14",                          sum:1240000,   st:"ok" },
  { d:"10.09.2026", type:"deal",   op:"Продажа",    ins:"Сбербанк России, 3 000 шт.",          sum:8600000,   st:"ok" },
  { d:"09.09.2026", type:"fee",    op:"Комиссия",   ins:"Брокерская комиссия за август",       sum:-42000,    st:"ok" },
  { d:"08.09.2026", type:"deal",   op:"Покупка",    ins:"ЯНДЕКС1Р5, 15 000 шт.",               sum:-15000000, st:"wait" },
  { d:"05.09.2026", type:"money",  op:"Вывод",      ins:"На расчётный счёт",                   sum:-5000000,  st:"no" }
];
var HIST_TYPES = { all:"Все операции", deal:"Сделки", money:"Движение денег", income:"Купоны и дивиденды", fee:"Комиссии" };
var ST_LABEL = { ok:["ok","Исполнено"], wait:["wait","В обработке"], no:["no","Отклонено"] };

var REQUEST_STAGES = [
  { t:"Заявка принята", when:"17.09.2026, 11:24", done:true,
    p:"Номер обращения " + REQUEST_ID + ". Подтверждение отправлено на почту." },
  { t:"Проверка документов", when:"17.09.2026, 14:05", done:true,
    p:"Устав и решение о назначении руководителя проверены. Карточка с образцами подписей получена из расчётного обслуживания." },
  { t:"Подписание документов", when:"Требуется действие", now:true,
    p:"Заявление на брокерское обслуживание и декларация о рисках готовы. Подписывает руководитель квалифицированной электронной подписью." },
  { t:"Счёт открыт", when:"Ожидается до 19.09.2026",
    p:"После подписания счёт активируется в течение одного рабочего дня, реквизиты придут в этот раздел." }
];

var BREAKDOWNS = {

var toastEl = document.getElementById("toast"), toastTimer = null;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, 2800);
}
function isNew(){ return state.persona === "new"; }
function isQual(){ return state.persona !== "notqual"; }
function canSign(){ return state.role === "director"; }

function donut(items, size){
  size = size || 212;
  var total = items.reduce(function(s,i){ return s + i[1]; }, 0);
  var r = 62, c = 2 * Math.PI * r, off = 0, arcs = "";
  items.forEach(function(it,i){
    var len = c * (it[1] / total);
    arcs += '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="' + CHART_COLORS[i % CHART_COLORS.length] +
      '" stroke-width="29" stroke-dasharray="' + (items.length > 1 ? len - 1.5 : len) + ' ' + (c - len + (items.length > 1 ? 1.5 : 0)) +
      '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 100 100)"><title>' + esc(it[0]) + ' — ' + esc(fmt(it[1])) + '</title></circle>';
    off += len;
  });
  return '<svg viewBox="0 0 200 200" width="' + size + '" height="' + size + '" role="img" aria-label="Диаграмма распределения">' + arcs +
    '<text x="100" y="104" text-anchor="middle" fill="var(--ink)" font-size="' + (size < 200 ? 10 : 11) + '" font-weight="700" font-family="Wix Madefor Display, Arial">' +
    esc(rub(total) + " ₽") + '</text></svg>';
}
function legend(items){
  return '<div class="legend">' + items.map(function(it,i){
    return '<div class="legend-row"><span class="sw" style="background:' + CHART_COLORS[i % CHART_COLORS.length] + '"></span>' +
      '<span class="lbl">' + esc(it[0]) + ' — <span class="num">' + esc(rub(it[1])) + ' Р</span></span></div>';
  }).join("") + '</div>';
}
function crumbs(parts){
  return '<div class="crumbs">' + parts.map(function(p,i){
    return i === parts.length - 1 ? '<span>' + esc(p[0]) + '</span>' : '<a href="' + p[1] + '">' + esc(p[0]) + '</a><span>›</span>';
  }).join("") + '</div>';
}

  closeMenu();
  var hash = location.hash || "#/", q = "", path = hash, qi = hash.indexOf("?");
  if(qi > -1){ q = hash.slice(qi + 1); path = hash.slice(0, qi); }
  var parts = path.replace(/^#\/?/, "").split("/").filter(Boolean), html;

  if(parts[0] === "persona" && parts[1]){
    setPersona(parts[1]); location.hash = "#/"; return;
  }

  if(parts.length === 0) html = VIEWS.home();
  else if(parts[0] === "portfolio" && parts[1] === "broker") html = VIEWS.broker(parts[2]);
  else if(parts[0] === "portfolio") html = VIEWS.portfolio();
  else if(parts[0] === "transfer" && parts[1] === "confirm") html = VIEWS.transferConfirm();
  else if(parts[0] === "transfer" && parts[1] === "sign") html = VIEWS.transferSign();
  else if(parts[0] === "transfer" && parts[1] === "done") html = VIEWS.transferDone();
  else if(parts[0] === "transfer") html = VIEWS.transfer();
  else if(parts[0] === "request") html = VIEWS.request();
  else if(parts[0] === "history") html = VIEWS.history();
  else if(parts[0] === "qual") html = VIEWS.qual();
  else if(parts[0] === "product") html = VIEWS.product(parts[1]);
  else if(parts[0] === "apply" && parts[2] === "done") html = VIEWS.applyDone(parts[1]);
  else if(parts[0] === "apply") html = VIEWS.apply(parts[1]);
  else if(parts[0] === "markets") html = VIEWS.markets(parts[1]);
  else if(parts[0] === "article") html = VIEWS.article();
  else if(parts[0] === "report") html = VIEWS.report();
  else if(parts[0] === "stub"){
    var t = /(?:^|&)t=([^&]*)/.exec(q);
    html = VIEWS.stub(t ? decodeURIComponent(t[1]) : "Этот экран");
  }
  else html = VIEWS.stub("Страница не найдена");

  if(html === "") return;
  document.getElementById("view").innerHTML = html;
  window.scrollTo(0,0);
  bind();
  document.getElementById("rail").classList.remove("open");
  document.getElementById("burger").setAttribute("aria-expanded","false");
}

/* ============ обработчики ============ */
function bind(){
  var form = document.getElementById("applyForm");
  if(form) form.addEventListener("submit", onApply);

  var tf = document.getElementById("transferForm");
  if(tf){
    var from = document.getElementById("from"), hint = document.getElementById("availHint");
    var showAvail = function(){
      var a = ACCOUNTS.filter(function(x){ return x.id === from.value; })[0];
      hint.textContent = "Доступно " + rub(a.avail) + " ₽";
    };
    from.addEventListener("change", showAvail); showAvail();
    tf.addEventListener("submit", onTransfer);
    document.getElementById("sum").addEventListener("input", function(){
      var d = this.value.replace(/\D/g, "");
      this.value = d ? new Intl.NumberFormat("ru-RU").format(Number(d)) : "";
    });
  }

  var toSign = document.getElementById("toSign");
  if(toSign) toSign.addEventListener("click", function(){
    if(canSign()) location.hash = "#/transfer/sign";
    else { transfer.signed = false; transfer.doc = docNo(); location.hash = "#/transfer/done"; }
  });

  var sf = document.getElementById("signForm");
  if(sf) sf.addEventListener("submit", function(e){
    e.preventDefault();
    var code = document.getElementById("code");
    var ok = /^\d{4}$/.test(code.value.trim());
    document.getElementById("f-code").classList.toggle("err", !ok);
    if(!ok){ toast("Введите код из четырёх цифр"); return; }
    transfer.signed = true; transfer.doc = docNo();
    location.hash = "#/transfer/done";
  });

  var signDocs = document.getElementById("signDocs");
  if(signDocs) signDocs.addEventListener("click", function(){ toast("Документы подписаны (демо). Счёт активируется до 19.09.2026"); });
  var askSign = document.getElementById("askSign");
  if(askSign) askSign.addEventListener("click", function(){ toast("Запрос подписи отправлен руководителю (демо)"); });

  var fType = document.getElementById("fType");
  if(fType) fType.addEventListener("change", function(){ VIEWS.history.type = this.value; render(); });
  var fPeriod = document.getElementById("fPeriod");
  if(fPeriod) fPeriod.addEventListener("change", function(){ toast("Период «" + this.value + "» — в прототипе данные не меняются"); });

  var rep = document.getElementById("reportForm");
  if(rep) rep.addEventListener("submit", function(e){
    e.preventDefault();
    var accs = [].slice.call(rep.querySelectorAll('input[name="acc"]:checked')).map(function(i){ return i.value; });
    var fmts = [].slice.call(rep.querySelectorAll('input[name="fmt"]:checked')).map(function(i){ return i.value; });
    if(!accs.length || !fmts.length){ toast("Выберите счет и тип отчета"); return; }
    toast("Отчет " + fmts.join(", ") + " по счету " + accs.join(", ") + " формируется (демо)");
  });

  var back = document.getElementById("backBtn");
  if(back) back.addEventListener("click", function(){ if(history.length > 1) history.back(); else location.hash = "#/"; });
}

function docNo(){ return "ПП-" + Math.floor(100000 + Math.random() * 899999); }

function onTransfer(e){
  e.preventDefault();
  var from = document.getElementById("from").value;
  var acc = ACCOUNTS.filter(function(a){ return a.id === from; })[0];
  var sum = Number(document.getElementById("sum").value.replace(/\D/g, ""));
  var err = document.getElementById("sumErr"), wrap = document.getElementById("f-sum");
  var msg = "";
  if(!sum) msg = "Укажите сумму";
  else if(sum < 100000) msg = "Минимальная сумма пополнения — 100 000 ₽";
  else if(sum > acc.avail) msg = "На счёте доступно " + rub(acc.avail) + " ₽";
  wrap.classList.toggle("err", !!msg);
  if(msg){ err.textContent = msg; toast(msg); return; }
  transfer = { from:from, sum:sum, signed:false, doc:docNo() };
  location.hash = "#/transfer/confirm";
}

function onApply(e){
  e.preventDefault();
  var id = location.hash.split("/")[2] || "broker", ok = true;
  function mark(wrapId, good){ document.getElementById(wrapId).classList.toggle("err", !good); if(!good) ok = false; }
  mark("f-name", document.getElementById("fio").value.trim().split(/\s+/).length >= 2);
  mark("f-phone", document.getElementById("phone").value.replace(/\D/g,"").length === 11);
  mark("f-org", document.getElementById("org").value.trim().length >= 3);
  mark("f-agree", document.getElementById("agree").checked);
  if(!ok){ toast("Проверьте выделенные поля"); return; }
  location.hash = "#/apply/" + id + "/done";
}

/* меню */
var openMenu = null;
function closeMenu(){
  if(!openMenu) return;
  var host = document.getElementById("menuHost");
  if(host) host.innerHTML = "";
  var b = document.querySelector('.menubtn[data-menu="' + openMenu + '"]');
  if(b) b.setAttribute("aria-expanded","false");
  openMenu = null;
}
function showMenu(id){
  var m = MENUS.filter(function(x){ return x.id === id; })[0];
  if(!m) return;
  document.getElementById("menuHost").innerHTML = '<div class="menu" role="menu">' + m.groups.map(function(g){
    return '<div class="col"><h5>' + esc(g.h) + '</h5>' + g.items.map(function(it){
      var lock = QUAL_ONLY.indexOf(it[0]) > -1 && !isQual();
      return '<a role="menuitem" class="' + (lock ? "locked" : "") + '" href="' + it[1] + '">- ' + esc(it[0]) + (lock ? " 🔒" : "") + '</a>';
    }).join("") + '</div>';
  }).join("") + '</div>';
  document.querySelector('.menubtn[data-menu="' + id + '"]').setAttribute("aria-expanded","true");
  openMenu = id;
}

document.addEventListener("click", function(e){
  var t = e.target;
  var mb = t.closest ? t.closest(".menubtn") : null;
  if(mb){ var id = mb.getAttribute("data-menu"); if(openMenu === id) closeMenu(); else { closeMenu(); showMenu(id); } return; }
  var go = t.closest ? t.closest("[data-go]") : null;
  if(go){ location.hash = go.getAttribute("data-go"); return; }
  var ex = t.closest ? t.closest("[data-export]") : null;
  if(ex){ toast("Выгрузка " + ex.getAttribute("data-export") + " формируется (демо)"); return; }
  var demo = t.closest ? t.closest("[data-demo]") : null;
  if(demo){ e.preventDefault(); toast(demo.getAttribute("data-demo")); return; }
  if(openMenu && !(t.closest && t.closest(".menu"))) closeMenu();
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeMenu(); });

/* левое меню и шапка */
document.getElementById("nav").innerHTML = NAV.map(function(n){
  if(n.grp) return '<div class="grp">' + esc(n.grp) + '</div>';
  return '<a href="' + n.href + '"' + (n.key === "invest" ? ' data-nav="invest"' : '') + '>' + esc(n.t) + '</a>';
}).join("");

document.getElementById("burger").addEventListener("click", function(){
  var open = document.getElementById("rail").classList.toggle("open");
  this.setAttribute("aria-expanded", String(open));
});
document.getElementById("search").addEventListener("keydown", function(e){
  if(e.key === "Enter" && this.value.trim()){ location.hash = stub("Поиск: " + this.value.trim()); this.value = ""; }
});

function markNav(){
  var inInvest = !/^#\/stub/.test(location.hash || "#/");
  document.querySelectorAll("#nav a").forEach(function(a){ a.classList.remove("active"); });
  if(inInvest){ var el = document.querySelector('#nav a[data-nav="invest"]'); if(el) el.classList.add("active"); }
}

/* переключатели демо */
var personaSel = document.getElementById("personaSel"), roleSel = document.getElementById("roleSel");
function setPersona(p){
  if(["qual","new","notqual"].indexOf(p) < 0) return;
  state.persona = p; personaSel.value = p;
  try{ localStorage.setItem("ib-persona", p); }catch(e){}
}
function setRole(r){
  state.role = r; roleSel.value = r;
  document.getElementById("userRole").textContent = r === "director" ? "Руководитель" : "Казначей";
  try{ localStorage.setItem("ib-role", r); }catch(e){}
}
personaSel.addEventListener("change", function(){
  setPersona(this.value); render();
  toast(this.value === "new" ? "Клиент без продуктов" : this.value === "notqual" ? "Неквалифицированный инвестор" : "Клиент с портфелем");
});
roleSel.addEventListener("change", function(){
  setRole(this.value); render();
  toast(this.value === "director" ? "Роль: руководитель — может подписывать" : "Роль: казначей — готовит документы");
});
setPersona(state.persona); setRole(state.role);

window.addEventListener("hashchange", function(){ render(); markNav(); });
render(); markNav();
})();
</script>
