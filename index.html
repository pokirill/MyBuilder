<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Инвестбанк — Совкомбанк Бизнес</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Wix+Madefor+Display:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F6FB; --surface:#FFFFFF; --surface-2:#EDF2FA; --line:#DAE3F0; --line-soft:#E8EEF7;
  --ink:#0E1B2E; --ink-2:#3B4C66; --muted:#5D6E88;
  --blue:#0033A1; --blue-2:#1D5BD6; --red:#E4002B; --red-ink:#FFFFFF;
  --ok:#0F7B5A; --warn:#8A5A00;
  --c1:#0033A1; --c2:#2E6BDC; --c3:#79A7EE; --c4:#B9D2F7; --c5:#12938E;
  --shadow:0 1px 2px rgba(14,27,46,.06), 0 8px 24px rgba(14,27,46,.06);
  --radius:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Golos Text","Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Wix Madefor Display","Golos Text",Arial,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--blue-2); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ---------- demo bar ---------- */
.demobar{
  background:#1B2942; color:#E7EEFA; font-size:12.5px; letter-spacing:.01em;
  padding:7px 16px; display:flex; gap:10px; align-items:center; justify-content:center; text-align:center;
}
.demobar b{font-weight:600}
.demobar .dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:16px; padding:10px 16px;
}
.logo{display:flex; flex-direction:column; line-height:1.05; font-family:"Wix Madefor Display",Arial,sans-serif; font-weight:800; font-size:16px; letter-spacing:-.02em; flex:none}
.logo .b1{color:var(--blue)}
.logo .b2{color:var(--red); font-size:13.5px; font-weight:700}
.search{flex:1; min-width:0; position:relative}
.search input{
  width:100%; padding:9px 36px 9px 12px; border:1px solid var(--line); border-radius:9px;
  background:var(--surface-2); color:var(--ink); font-size:14px;
}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute; right:10px; top:50%; transform:translateY(-50%); opacity:.55}
.org{flex:none; font-size:13.5px; color:var(--ink-2); font-weight:500; white-space:nowrap}
.burger{display:none; flex:none; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; cursor:pointer}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); gap:0; align-items:start}
.rail{
  position:sticky; top:57px; align-self:start; height:calc(100vh - 57px); overflow:auto;
  background:var(--surface); border-right:1px solid var(--line); padding:18px 12px 32px;
}
.rail .grp{padding:16px 10px 6px; font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600}
.rail a{display:block; padding:8px 10px; border-radius:8px; color:var(--ink-2); font-size:14.5px}
.rail a:hover{background:var(--surface-2); color:var(--ink)}
.rail a.active{background:color-mix(in srgb, var(--blue) 12%, transparent); color:var(--blue); font-weight:600}
.main{padding:20px 24px 64px; min-width:0; max-width:1180px}

/* ---------- quick actions ---------- */
.quick{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
.chip{
  background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px;
  font-size:13.5px; color:var(--ink-2); cursor:pointer;
}
.chip:hover{border-color:var(--blue-2); color:var(--blue)}

/* ---------- generic blocks ---------- */
.crumbs{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); margin-bottom:10px; flex-wrap:wrap}
.crumbs a:hover{color:var(--blue); text-decoration:underline}
.pagehead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.pagehead h1{font-size:30px; font-weight:700}
.lede{color:var(--ink-2); max-width:62ch; margin-top:8px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
.card-h{font-size:16px; font-weight:700; margin-bottom:12px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px}
.btn{
  display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); padding:9px 16px; border-radius:9px; cursor:pointer; font-size:14.5px; font-weight:500;
}
.btn:hover{border-color:var(--blue-2); color:var(--blue)}
.btn-primary{background:var(--red); border-color:var(--red); color:var(--red-ink); font-weight:600}
.btn-primary:hover{filter:brightness(1.07); color:var(--red-ink); border-color:var(--red)}
.btn-ghost{background:transparent}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.tab{padding:8px 15px; border-radius:999px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:14px; color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600}
.rows{display:flex; flex-direction:column}
.row{
  display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; text-align:left;
  padding:14px 4px; border-bottom:1px solid var(--line-soft); background:none; border-left:0; border-right:0; border-top:0; cursor:pointer;
}
.row:last-child{border-bottom:0}
.row:hover .row-name{color:var(--blue)}
.row-name{display:block; font-weight:500}
.row-sub{display:block; font-size:12.5px; color:var(--muted); margin-top:3px}
.row-val{font-weight:600; white-space:nowrap}
.pill{display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; counter-reset:s}
.step{position:relative; padding-top:6px}
.step .n{width:34px;height:34px;border-radius:10px;background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; margin-bottom:10px; font-family:"Wix Madefor Display",Arial,sans-serif}
.step h4{font-size:15px; margin-bottom:6px}
.step p{margin:0; color:var(--ink-2); font-size:14px}
.hr{height:1px; background:var(--line); border:0; margin:28px 0}
.sect-h{font-size:20px; font-weight:700; margin:28px 0 14px}

/* ---------- menus ---------- */
.menubar{display:flex; gap:8px; flex-wrap:wrap; position:relative; margin:18px 0 12px}
.menubtn{padding:9px 16px; border:1px solid var(--line); background:var(--surface); border-radius:9px; cursor:pointer; font-size:14.5px; font-weight:500}
.menubtn[aria-expanded="true"]{border-color:var(--blue); color:var(--blue); box-shadow:inset 0 -2px 0 var(--blue)}
.menu{
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:30;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px 22px;
}
.menu h5{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-family:"Golos Text",Arial,sans-serif}
.menu a{display:block; padding:6px 8px; margin-left:-8px; border-radius:7px; font-size:14px; color:var(--ink-2)}
.menu a:hover{background:var(--surface-2); color:var(--blue)}

/* ---------- banner ---------- */
.banner{
  margin-top:16px; border-radius:var(--radius); border:1px solid var(--line); overflow:hidden;
  background:linear-gradient(120deg, color-mix(in srgb,var(--blue) 92%, #000) 0%, var(--blue) 55%, #1D5BD6 100%);
  color:#fff; padding:26px 24px; display:flex; gap:20px; align-items:center; justify-content:space-between; flex-wrap:wrap;
}
.banner h3{font-size:22px; margin-bottom:8px; color:#fff}
.banner p{margin:0; max-width:56ch; color:rgba(255,255,255,.86); font-size:14.5px}
.banner .btn{background:#fff; color:var(--blue); border-color:#fff; font-weight:600}
.banner .btn:hover{color:var(--blue)}
.banner-meta{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.72); margin-bottom:10px}

/* ---------- donut ---------- */
.donut-wrap{display:flex; gap:28px; align-items:center; flex-wrap:wrap}
.legend{display:flex; flex-direction:column; gap:10px; min-width:240px; flex:1}
.legend-row{display:flex; align-items:center; gap:10px; font-size:14px}
.legend-row .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend-row .lbl{flex:1; color:var(--ink-2)}
.legend-row .val{font-weight:600; white-space:nowrap}
.legend-row .pct{color:var(--muted); width:52px; text-align:right}

/* ---------- forms ---------- */
.form{max-width:520px}
.field{margin-bottom:18px}
.field label{display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:6px}
.field label .req{color:var(--red)}
.field input[type="text"], .field input[type="tel"]{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2);
  color:var(--ink); font-size:15px;
}
.field input::placeholder{color:var(--muted)}
.field.err input{border-color:var(--red)}
.err-msg{display:none; color:var(--red); font-size:13px; margin-top:6px}
.field.err .err-msg{display:block}
.check{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--ink-2); margin-bottom:20px}
.check input{margin-top:3px; accent-color:var(--blue); width:16px; height:16px}
.opt{display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:9px; cursor:pointer; background:var(--surface); margin-bottom:8px}
.opt:hover{border-color:var(--blue-2)}
.opt input{accent-color:var(--blue); width:16px; height:16px}
.opt .hint{margin-left:auto; font-size:12.5px; color:var(--muted)}

/* ---------- article ---------- */
.prose{max-width:66ch}
.prose p{color:var(--ink-2); margin:0 0 16px}
.prose h3{font-size:19px; margin:26px 0 10px}
.prose ul{color:var(--ink-2); padding-left:20px; margin:0 0 16px}
.prose li{margin-bottom:6px}

/* ---------- empty state ---------- */
.empty{text-align:center; padding:56px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius)}
.empty h2{font-size:22px; margin-bottom:10px}
.empty p{color:var(--muted); max-width:46ch; margin:0 auto 20px}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); opacity:0; pointer-events:none;
  background:#1B2942; color:#fff; padding:12px 18px; border-radius:10px; font-size:14px; z-index:80; box-shadow:var(--shadow);
  transition:opacity .18s ease, transform .18s ease; max-width:90vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .burger{display:block}
  .rail{
    position:fixed; inset:57px auto 0 0; width:264px; height:calc(100vh - 57px); z-index:50;
    transform:translateX(-102%); transition:transform .18s ease; box-shadow:var(--shadow);
  }
  .rail.open{transform:none}
  .main{padding:16px 16px 56px}
  .org{display:none}
  .pagehead h1{font-size:24px}
  .menu{position:static; grid-template-columns:1fr; margin-top:8px}
}
</style>
</head>

function stub(t){ return "#/stub?t=" + encodeURIComponent(t); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
var CHART_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];

/* ============ мелкие помощники ============ */
var toastEl = document.getElementById("toast"), toastTimer = null;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, 2600);
}

function donut(items, centerLabel){
  var total = items.reduce(function(s,i){ return s + i[1]; }, 0);
  var r = 62, c = 2 * Math.PI * r, off = 0, arcs = "";
  items.forEach(function(it, i){
    var len = c * (it[1] / total);
    arcs += '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="' + CHART_COLORS[i % CHART_COLORS.length] +
            '" stroke-width="30" stroke-dasharray="' + (len - 1.5) + ' ' + (c - len + 1.5) + '" stroke-dashoffset="' + (-off) +
            '" transform="rotate(-90 100 100)"><title>' + esc(it[0]) + ' — ' + esc(fmt(it[1])) + '</title></circle>';
    off += len;
  });
  var legend = items.map(function(it,i){
    return '<div class="legend-row"><span class="sw" style="background:' + CHART_COLORS[i % CHART_COLORS.length] + '"></span>' +
           '<span class="lbl">' + esc(it[0]) + '</span>' +
           '<span class="val num">' + esc(fmt(it[1])) + '</span>' +
           '<span class="pct num">' + (Math.round(it[1] / total * 1000) / 10).toString().replace(".", ",") + '%</span></div>';
  }).join("");
  return '<div class="donut-wrap">' +
      '<svg viewBox="0 0 200 200" width="212" height="212" role="img" aria-label="Диаграмма распределения">' + arcs +
      '<text x="100" y="95" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="Golos Text, Arial" letter-spacing="0.5">' + esc(centerLabel || "ВСЕГО") + '</text>' +
      '<text x="100" y="114" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="700" font-family="Wix Madefor Display, Arial">' + esc(fmt(total)) + '</text>' +
      '</svg><div class="legend">' + legend + '</div></div>';
}

function crumbs(parts){
  return '<div class="crumbs">' + parts.map(function(p,i){
    var last = i === parts.length - 1;
    return (last ? '<span>' + esc(p[0]) + '</span>' : '<a href="' + p[1] + '">' + esc(p[0]) + '</a><span>›</span>');
  }).join("") + '</div>';
}

      '<label class="opt"><input type="radio" name="fmt" value="xlsx"><span>Excel</span><span class="hint">без подписи</span></label>' +
      '<label class="opt"><input type="radio" name="fmt" value="xml"><span>XML</span><span class="hint">без подписи</span></label>' +
      '<div style="margin-top:22px"><button class="btn btn-primary" type="submit">Сформировать</button>' +
      '<a class="btn btn-ghost" href="#/" style="margin-left:8px">Отмена</a></div>' +
    '</form></div>';
};

VIEWS.stub = function(title){
  return '<div class="empty">' +
    '<div class="pill" style="margin-bottom:14px">Вне прототипа</div>' +
    '<h2>' + esc(title || "Этот экран") + '</h2>' +
    '<p>Этого экрана нет в прототипе — он существует в интернет-банке, но в макет «Инвестбанка» не входит.</p>' +
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
      '<button class="btn" id="backBtn">Назад</button>' +
      '<a class="btn btn-ghost" href="#/">На главную Инвестбанка</a></div></div>';
};

/* ============ роутер ============ */
function render(){
  closeMenu();
  var hash = location.hash || "#/";
  var q = "", path = hash;
  var qi = hash.indexOf("?");
  if(qi > -1){ q = hash.slice(qi + 1); path = hash.slice(0, qi); }
  var parts = path.replace(/^#\/?/, "").split("/").filter(Boolean);
  var view = document.getElementById("view"), html;

  if(parts.length === 0) html = VIEWS.home();
  else if(parts[0] === "portfolio" && parts[1] === "broker") html = VIEWS.broker(parts[2]);
  else if(parts[0] === "portfolio") html = VIEWS.portfolio();
  else if(parts[0] === "product") html = VIEWS.product(parts[1]);
  else if(parts[0] === "apply" && parts[2] === "done") html = VIEWS.applyDone(parts[1]);
  else if(parts[0] === "apply") html = VIEWS.apply(parts[1]);
  else if(parts[0] === "markets") html = VIEWS.markets(parts[1]);
  else if(parts[0] === "article") html = VIEWS.article();
  else if(parts[0] === "report") html = VIEWS.report();
  else if(parts[0] === "stub"){
    var t = /(?:^|&)t=([^&]*)/.exec(q);
    html = VIEWS.stub(t ? decodeURIComponent(t[1]) : "Этот экран");
  }
  else html = VIEWS.stub("Страница не найдена");

  view.innerHTML = html;
  window.scrollTo(0, 0);
  bind();
  document.getElementById("rail").classList.remove("open");
  document.getElementById("burger").setAttribute("aria-expanded","false");
}

/* ============ обработчики ============ */
function bind(){
  var form = document.getElementById("applyForm");
  if(form) form.addEventListener("submit", onApply);
  var rep = document.getElementById("reportForm");
  if(rep) rep.addEventListener("submit", function(e){
    e.preventDefault();
    var acc = rep.querySelector('input[name="acc"]:checked').value;
    var f = rep.querySelector('input[name="fmt"]:checked').value.toUpperCase();
    toast("Отчёт " + f + " по счёту " + acc + " формируется (демо)");
  });
  var back = document.getElementById("backBtn");
  if(back) back.addEventListener("click", function(){ if(history.length > 1) history.back(); else location.hash = "#/"; });
}

function onApply(e){
  e.preventDefault();
  var id = location.hash.split("/")[2] || "broker";
  var fio = document.getElementById("fio"), phone = document.getElementById("phone"),
      org = document.getElementById("org"), agree = document.getElementById("agree");
  var ok = true;
  function mark(wrapId, good){
    document.getElementById(wrapId).classList.toggle("err", !good);
    if(!good) ok = false;
  }
  mark("f-name", fio.value.trim().split(/\s+/).length >= 2);
  mark("f-phone", (phone.value.replace(/\D/g, "").length === 11));
  mark("f-org", org.value.trim().length >= 3);
  mark("f-agree", agree.checked);
  if(!ok){ toast("Проверьте выделенные поля"); return; }
  location.hash = "#/apply/" + id + "/done";
}

/* ---- выпадающие меню ---- */
var openMenu = null;
function closeMenu(){
  if(!openMenu) return;
  var host = document.getElementById("menuHost");
  if(host) host.innerHTML = "";
  var b = document.querySelector('.menubtn[data-menu="' + openMenu + '"]');
  if(b) b.setAttribute("aria-expanded","false");
  openMenu = null;
}
function showMenu(id){
  var m = MENUS.filter(function(x){ return x.id === id; })[0];
  if(!m) return;
  var host = document.getElementById("menuHost");
  host.innerHTML = '<div class="menu" role="menu">' + m.groups.map(function(g){
    return '<div><h5>' + esc(g.h) + '</h5>' + g.items.map(function(it){
      return '<a role="menuitem" href="' + it[1] + '">' + esc(it[0]) + '</a>';
    }).join("") + '</div>';
  }).join("") + '</div>';
  document.querySelector('.menubtn[data-menu="' + id + '"]').setAttribute("aria-expanded","true");
  openMenu = id;
}

document.addEventListener("click", function(e){
  var mb = e.target.closest ? e.target.closest(".menubtn") : null;
  if(mb){ var id = mb.getAttribute("data-menu"); if(openMenu === id) closeMenu(); else { closeMenu(); showMenu(id); } return; }
  var go = e.target.closest ? e.target.closest("[data-go]") : null;
  if(go){ location.hash = go.getAttribute("data-go"); return; }
  var demo = e.target.closest ? e.target.closest("[data-demo]") : null;
  if(demo){ toast(demo.getAttribute("data-demo")); return; }
  if(openMenu && !(e.target.closest && e.target.closest(".menu"))) closeMenu();
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeMenu(); });


/* ---- левое меню, поиск, бургер ---- */
document.getElementById("nav").innerHTML = NAV.map(function(n){
  if(n.type === "grp") return '<div class="grp">' + esc(n.t) + '</div>';
  return '<a href="' + n.href + '"' + (n.key === "invest" ? ' data-nav="invest"' : '') + '>' + esc(n.t) + '</a>';
}).join("");

document.getElementById("burger").addEventListener("click", function(){
  var rail = document.getElementById("rail");
  var open = rail.classList.toggle("open");
  this.setAttribute("aria-expanded", String(open));
});

document.getElementById("search").addEventListener("keydown", function(e){
  if(e.key === "Enter" && this.value.trim()){
    location.hash = stub("Поиск: " + this.value.trim());
    this.value = "";
  }
});

function markNav(){
  var inInvest = !/^#\/stub/.test(location.hash || "#/");
  document.querySelectorAll('#nav a').forEach(function(a){ a.classList.remove("active"); });
  if(inInvest){
    var el = document.querySelector('#nav a[data-nav="invest"]');
    if(el) el.classList.add("active");
  }
}

window.addEventListener("hashchange", function(){ render(); markNav(); });
render(); markNav();
})();
</script>
</body>
</html>
